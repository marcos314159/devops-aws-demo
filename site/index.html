<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps na AWS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-app="aws-devops-demo">

    <main class="container">
        <p class="label">DEVOPS • AWS</p>

        <h1>Pipeline automatizado de deploy</h1>

        <p class="description">
            Demonstração prática de CI/CD utilizando serviços da AWS.
        </p>

        <div class="version">
            Versão 2.0
        </div>

        <div class="pipeline-status">

            <div class="pipeline-card">
                <h2>SOURCE</h2>
                <p class="success">✓ Código recebido</p>
            </div>

            <div class="pipeline-card">
                <h2>BUILD</h2>
                <p class="success">✓ Validações concluídas</p>
            </div>

            <div class="pipeline-card">
                <h2>DEPLOY</h2>
                <p class="success">✓ Publicado na AWS</p>
            </div>

        </div>
    </main>

</body>
</html>
